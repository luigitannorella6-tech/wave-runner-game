<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wave Runner</title>
<style>
  body { margin:0; background:black; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let player = { x: 80, y: canvas.height/2, size: 10 };
let goingUp = false;

let speed = 5;
let gaps = [];
let score = 0;
let best = localStorage.getItem("best") || 0;

function spawnGap() {
  let gapY = Math.random() * (canvas.height - 150) + 50;
  gaps.push({ x: canvas.width, gapY, gapHeight: 120 });
}

function update() {
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  player.y += goingUp ? -4 : 4;

  ctx.fillStyle = "cyan";
  ctx.shadowBlur = 20;
  ctx.shadowColor = "cyan";
  ctx.fillRect(player.x, player.y, player.size, player.size);
  ctx.shadowBlur = 0;

  if (Math.random() < 0.02) spawnGap();

  gaps.forEach(g => {
    g.x -= speed;

    ctx.fillStyle = "red";
    ctx.fillRect(g.x, 0, 30, g.gapY);
    ctx.fillRect(g.x, g.gapY + g.gapHeight, 30, canvas.height);

    if (
      player.x < g.x + 30 &&
      player.x + player.size > g.x &&
      (player.y < g.gapY || player.y > g.gapY + g.gapHeight)
    ) {
      if (score > best) {
        best = score;
        localStorage.setItem("best", best);
      }
      alert("Game Over\nScore: " + score + "\nBest: " + best);
      location.reload();
    }
  });

  score++;

  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Score: " + score, 20, 30);
  ctx.fillText("Best: " + best, 20, 60);

  requestAnimationFrame(update);
}

window.addEventListener("touchstart", () => goingUp = true);
window.addEventListener("touchend", () => goingUp = false);
window.addEventListener("keydown", e => {
  if (e.code === "Space") goingUp = true;
});
window.addEventListener("keyup", e => {
  if (e.code === "Space") goingUp = false;
});

update();
</script>

</body>
</html>
