<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wave Dash</title>
<style>
body { margin:0; font-family:sans-serif; background:#111; color:white; overflow:hidden; }

.screen {
  position:absolute;
  width:100%;
  height:100%;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

.active { display:flex; }

/* Buttons */
.btn {
  background:#2ecc71;
  padding:15px 25px;
  margin:10px;
  border-radius:10px;
  font-size:20px;
}

/* Side buttons */
.side-left { position:absolute; left:20px; top:50%; transform:translateY(-50%); }
.side-right { position:absolute; right:20px; top:50%; transform:translateY(-50%); }

/* Small UI */
.bottom-left { position:absolute; bottom:10px; left:10px; font-size:12px; }
.top-right { position:absolute; top:10px; right:10px; }

canvas { display:block; }
</style>
</head>

<body>

<!-- MAIN MENU -->
<div id="menu" class="screen active">
  <h1>Wave Dash</h1>

  <div class="btn" onclick="startGame()">▶ PLAY</div>

  <div class="btn side-left" onclick="showScreen('icons')">🎨</div>
  <div class="btn side-right" onclick="showScreen('more')">⚙</div>

  <div class="btn top-right" onclick="dailyReward()">🎁</div>

  <div class="bottom-left">
    Support the original creator 👍
  </div>
</div>

<!-- ICON MENU -->
<div id="icons" class="screen">
  <h2>Icons</h2>
  <p>(30 icons placeholder)</p>
  <div class="btn" onclick="showScreen('menu')">⬅ Back</div>
</div>

<!-- MORE MENU -->
<div id="more" class="screen">
  <h2>More</h2>
  <div class="btn">🧱 Level Editor (soon)</div>
  <div class="btn">🌐 Online Levels (soon)</div>
  <div class="btn" onclick="showScreen('menu')">⬅ Back</div>
</div>

<!-- GAME -->
<canvas id="game" class="screen"></canvas>

<script>
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startGame(){
  showScreen('game');
  initGame();
}

function dailyReward(){
  alert("🎁 You got 10 coins!");
}

/* ==== GAME ==== */
let canvas = document.getElementById("game");
let ctx = canvas.getContext("2d");

function initGame(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  player = { x: 100, y: canvas.height/2, size: 12 };
  goingUp = false;
  gaps = [];
  score = 0;

  requestAnimationFrame(update);
}

let player, goingUp, gaps, score;
const GAP = 160;
const SPEED = 5;

function spawn(){
  let y = Math.random() * (canvas.height - GAP - 40) + 20;
  gaps.push({ x: canvas.width, y });
}

function update(){
  ctx.fillStyle = "black";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // wave movement (REAL style)
  player.x += SPEED;
  player.y += goingUp ? -SPEED : SPEED;

  // draw wave (triangle icon)
  ctx.fillStyle = "cyan";
  ctx.beginPath();
  ctx.moveTo(player.x, player.y);
  ctx.lineTo(player.x - 10, player.y + 5);
  ctx.lineTo(player.x - 10, player.y - 5);
  ctx.closePath();
  ctx.fill();

  if (gaps.length === 0 || canvas.width - gaps[gaps.length-1].x > 300){
    spawn();
  }

  gaps.forEach(g=>{
    g.x -= SPEED;

    ctx.fillStyle="red";
    ctx.fillRect(g.x,0,40,g.y);
    ctx.fillRect(g.x,g.y+GAP,40,canvas.height);

    if (
      player.x < g.x + 40 &&
      player.x > g.x &&
      (player.y < g.y || player.y > g.y + GAP)
    ){
      alert("Game Over");
      showScreen('menu');
    }
  });

  requestAnimationFrame(update);
}

/* controls */
window.addEventListener("touchstart", ()=> goingUp=true);
window.addEventListener("touchend", ()=> goingUp=false);
window.addEventListener("keydown", e=> { if(e.code==="Space") goingUp=true; });
window.addEventListener("keyup", e=> { if(e.code==="Space") goingUp=false; });

</script>
</body>
</html>
